name: Build Development APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

concurrency:
  group: "dev-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Development APK
        env:
          BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
        run: ./gradlew -PdevBuild=true "assemble${BUILD_VARIANT^}"

      - uses: actions/upload-artifact@v4
        with:
          name: development-${{ inputs.variant || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.variant || 'debug' }}/*.apk
          if-no-files-found: error
